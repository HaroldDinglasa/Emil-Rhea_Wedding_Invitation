<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attire Guide · Emil &amp; Rhea</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',ink:'var(--ink)',soft:'var(--soft)',gold:'var(--gold)',line:'var(--line)'},fontFamily:{serif:['Georgia','serif']}}}}</script>
  <style>:root{--bg:#e8efe0;--ink:#3f5139;--soft:#687862;--gold:#9b7838;--line:rgba(63,81,57,.24)}body{background:var(--bg)}</style>
</head>
<body class="min-h-screen bg-bg text-ink font-serif text-xl leading-relaxed">
  <main class="px-6 py-24 text-center">
    <p class="uppercase tracking-[.3em] text-sm text-gold">Attire Guide</p>
    <h1 class="mt-4 text-5xl font-light">Dress for the celebration</h1>
    <img src="attireguide.jpg" alt="Wedding attire guide" class="mx-auto mt-10 block h-auto w-full max-w-3xl rounded-lg object-contain shadow-sm" loading="lazy">
  </main>
</body>
</html>
